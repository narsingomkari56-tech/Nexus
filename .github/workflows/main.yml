name: Build APK from HTML
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wrap HTML into Android App
        run: |
          # 1. Isolate the web files
          mkdir web_build
          rsync -av --exclude='web_build' --exclude='.git' --exclude='.github' ./ web_build/
          
          # 2. Install the Capacitor Android Wrapper
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Nexus App" "com.nexus.app" --web-dir web_build
          npx cap add android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
