name: Build APK from HTML
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Base Project and Wrap HTML
        run: |
          # 1. Safely create the web folder
          mkdir -p web_build
          
          # 2. Force the index.html into the folder. If missing, make a temporary one to prevent a crash.
          if [ -f "index.html" ]; then
            cp index.html web_build/
          else
            echo "<h1>App is running! Please upload your real index.html to GitHub.</h1>" > web_build/index.html
          fi
          
          # 3. Create a clean Node environment
          cat <<EOF > package.json
          {
            "name": "nexus-app",
            "version": "1.0.0"
          }
          EOF
          
          # 4. Install EXACT Capacitor versions so they don't break
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          # 5. Initialize the Android wrapper
          npx cap init "Nexus App" "com.nexus.app" --web-dir web_build 
          npx cap add android

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
